version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: marketing-backend

    ports:
      - "8040:8040"

    env_file:
      - ./.env

    restart: unless-stopped

    # `default` keeps this service's existing (implicit) network attachment;
    # `searxng_default` is the already-running SearXNG instance's external
    # network, added only so the backend can resolve http://searxng:8080
    # for GST/turnover search (see SEARXNG_URL in .env). No new ports are
    # exposed - SearXNG is already published on the host at :8080.
    networks:
      - default
      - searxng_default

networks:
  searxng_default:
    external: true
